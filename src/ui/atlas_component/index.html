<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<iframe id="graph" title="Interaktiver Wissensatlas" style="width:100%;border:0"></iframe>
<script>
const graph = document.getElementById('graph');
let currentHTML = null;
let selectionSequence = 0;
function send(type, data) { parent.postMessage({isStreamlitMessage: true, type, ...data}, '*'); }
window.addEventListener('message', event => {
  if (event.data.type === 'streamlit:render' && event.source === parent) {
    const args = event.data.args;
    if (args.html !== currentHTML) { currentHTML = args.html; graph.srcdoc = args.html; }
    graph.style.height = args.height + 'px';
    send('streamlit:setFrameHeight', {height: args.height});
  } else if (event.source === graph.contentWindow && event.data.type === 'atlas-selection') {
    send('streamlit:setComponentValue', {value: {...event.data.selection, event_id: Date.now() + ":" + (++selectionSequence)}, dataType: 'json'});
  }
});
send('streamlit:componentReady', {apiVersion: 1});
</script></body></html>
